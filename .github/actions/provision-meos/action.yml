name: Provision MEOS artifacts
description: >-
  Derive the language-neutral MEOS artifacts from a single MobilityDB commit:
  generate output/meos-idl.json via run.py and, optionally, build and install
  libmeos with all families. Any binding consumes it from one pinned commit.

  The derivation itself (configure, build, install, parse) is tools/provision-meos.sh,
  the one recipe this action and a local refresh both call, so CI and by-hand cannot
  drift. This action adds only the runner bootstrapping around it: checkout, Python, and
  the apt packages.

inputs:
  mobilitydb-ref:
    description: MobilityDB git ref (SHA or branch) to derive the artifacts from.
    required: true
  build-libmeos:
    description: Also build and install libmeos.so (all families by default).
    required: false
    default: "false"
  families:
    description: cmake family flags for the optional libmeos build.
    required: false
    default: "-DALL=ON"

outputs:
  catalog-path:
    description: Absolute path to the generated meos-idl.json.
    value: ${{ steps.catalog.outputs.catalog-path || steps.provision.outputs.catalog-path || steps.restore.outputs.catalog-path }}
  libmeos-prefix:
    description: Install prefix of libmeos when build-libmeos=true (else empty).
    value: ${{ steps.provision.outputs.libmeos-prefix || steps.restore.outputs.libmeos-prefix }}
  mobilitydb-src:
    description: >-
      The MobilityDB checkout the catalog was derived from. A consumer reads
      this rather than the directory name, which is this action's to choose:
      the parse locates the sources through $MDB_SRC_ROOT, and a job wanting
      the same sources (a suite whose drift gates read meos_catalog.c) sets
      that variable from here.
    value: ${{ github.workspace }}/_mobilitydb_src

runs:
  using: composite
  steps:
    # The MEOS headers + C sources the catalog is derived from. The whole
    # repository is fetched (not just headers) so run.py can read meos/src,
    # mobilitydb/src and mobilitydb/sql for the @sqlfn/@ingroup maps, and so
    # the optional libmeos build below can configure it.
    - name: Checkout MobilityDB @ ref
      uses: actions/checkout@v4
      with:
        repository: MobilityDB/MobilityDB
        ref: ${{ inputs.mobilitydb-ref }}
        path: _mobilitydb_src

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # libclang (Python wheel) needs the system C headers MEOS depends on so
    # types like size_t / json_object * / GSERIALIZED * resolve to their real
    # names instead of degrading to int / int *. Same install set as the
    # pytest / OpenAPI-validate regenerate paths so every path agrees.
    - name: Install dev headers for the libclang sysroot
      shell: bash
      run: |
        bash "$GITHUB_ACTION_PATH/apt-get.sh" update -qq
        bash "$GITHUB_ACTION_PATH/apt-get.sh" install -y --no-install-recommends \
          clang libclang-dev \
          libjson-c-dev libgsl-dev libproj-dev libgeos-dev \
          postgresql-server-dev-16

    # run.py + parser/ + meta/ + requirements.txt + tools/provision-meos.sh all
    # live at the MEOS-API repo root. When this action is consumed cross-repo
    # GitHub checks out the WHOLE MEOS-API repository under $GITHUB_ACTION_PATH,
    # so the repo root is $GITHUB_ACTION_PATH/../../.. in both the local dogfood
    # and cross-repo use.
    - name: Install Python dependencies
      shell: bash
      run: |
        REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        python -m pip install --upgrade pip
        pip install -r "$REPO_ROOT/requirements.txt"

    # Catalog-only path (no libmeos build): provision-meos.sh parses the source
    # MobilityDB MEOS headers with libclang and emits output/meos-idl.json,
    # pointing the @sqlfn/@ingroup extraction (MDB_SRC_ROOT) at the SAME checkout.
    # The source-tree headers wrap PostgreSQL types in stubs conditionally, so
    # struct field layouts are approximate here; the build path below is exact.
    - name: Generate the catalog
      id: catalog
      if: inputs.build-libmeos != 'true'
      shell: bash
      run: |
        REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        "$REPO_ROOT/tools/provision-meos.sh" --mdb-src "$GITHUB_WORKSPACE/_mobilitydb_src"

    # Optional: build and install libmeos with all families. Mirrors the green
    # all-families recipe used by the JVM bindings: purge the runner's
    # preinstalled PostgreSQL and use apt.postgresql.org PG17 so the vendored
    # pgPointCloud PGXS build finds clang-19.
    - name: Remove preinstalled PostgreSQL [prefer apt.postgresql.org]
      if: inputs.build-libmeos == 'true'
      shell: bash
      run: |
        sudo service postgresql stop || true
        bash "$GITHUB_ACTION_PATH/apt-get.sh" --purge remove postgresql* -y || true
        sudo rm -rf /var/lib/postgresql/ /etc/postgresql/ /var/log/postgresql/ || true

    - name: Add PostgreSQL APT repository (PGDG)
      if: inputs.build-libmeos == 'true'
      shell: bash
      run: |
        bash "$GITHUB_ACTION_PATH/apt-get.sh" install -y --no-install-recommends \
          curl ca-certificates gnupg
        curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
        sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ \
          $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'

    # The two caches of the build path. The packages: libgdal-dev depends on the -dev
    # packages of its drivers (mariadb, poppler, spatialite, xerces) and postgresql-server-dev-17
    # on clang-19 and llvm-19, about 200 MB a runner downloads on every run, so the .deb files
    # are kept in a runner-writable directory keyed on the runner image and the package list;
    # a new image restores the previous one's files and downloads only what changed. The
    # derivation: the libmeos prefix and the catalog are a function of the MobilityDB commit,
    # the MEOS-API files that derive them, the families and the runner image, so a run on the
    # same four restores them instead of building. A cross-repo action has no .git, so the
    # MEOS-API side of the key is a hash of its files' contents.
    - name: Key the provision caches
      id: keys
      if: inputs.build-libmeos == 'true'
      shell: bash
      env:
        PACKAGES: >-
          libgeos-dev libproj-dev libjson-c-dev libgsl-dev libh3-dev libgdal-dev libxml2-dev
          autoconf automake libtool pkg-config postgresql-17 postgresql-server-dev-17
        FAMILIES: ${{ inputs.families }}
      run: |
        REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
        mdb_sha="$(git -C "$GITHUB_WORKSPACE/_mobilitydb_src" rev-parse HEAD)"
        api_hash="$(cd "$REPO_ROOT" && find run.py requirements.txt parser meta tools \
          .github/actions/provision-meos -type f -not -path '*/__pycache__/*' -print0 \
          | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
        pkg_hash="$(echo "$PACKAGES" | tr -s ' \n' '\n\n' | sort | sha256sum | cut -c1-16)"
        fam_hash="$(echo "$FAMILIES" | sha256sum | cut -c1-16)"
        {
          echo "packages=$PACKAGES"
          echo "deb-prefix=provision-meos-debs-${ImageOS:-unknown}-"
          echo "deb-key=provision-meos-debs-$image-$pkg_hash"
          echo "build-key=provision-meos-build-$image-$mdb_sha-$api_hash-$fam_hash"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the downloaded packages
      if: inputs.build-libmeos == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.keys.outputs.deb-key }}
        restore-keys: ${{ steps.keys.outputs.deb-prefix }}

    - name: Restore the derived libmeos prefix and catalog
      id: build-cache
      if: inputs.build-libmeos == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/meos-headers
          ${{ runner.temp }}/meos-catalog
        key: ${{ steps.keys.outputs.build-key }}

    # Installed on a cache hit too: libmeos.so is linked against these libraries, and a
    # consumer builds and runs against it.
    - name: Install libmeos build dependencies
      if: inputs.build-libmeos == 'true'
      shell: bash
      env:
        APT_ARCHIVES: ${{ runner.temp }}/apt-archives
      run: |
        bash "$GITHUB_ACTION_PATH/apt-get.sh" update
        bash "$GITHUB_ACTION_PATH/apt-get.sh" install -y --no-install-recommends \
          ${{ steps.keys.outputs.packages }}
        # The cache step saves the directory as the runner user; apt wrote it as root.
        sudo chmod -R a+rX "$APT_ARCHIVES"
        sudo rm -f "$APT_ARCHIVES/lock"

    # Build path: provision-meos.sh builds libmeos, stages a clean MEOS-only
    # header prefix ($RUNNER_TEMP/meos-headers) that the parse reads, and installs
    # the runtime library under /usr/local for the consumer builds. It derives the
    # catalog from the INSTALLED headers: `make install` writes the generated,
    # self-contained headers (meos_export.h spliced with postgres_ext_defs.in.h in
    # place of the source's `#include <postgres.h>`), so libclang resolves every
    # struct field to its real C type and byte offset — the FFI-accurate layout the
    # native bindings need. MDB_SRC_ROOT stays the source checkout for @sqlfn/@ingroup.
    - name: Build libmeos and generate the catalog from installed headers
      id: provision
      if: inputs.build-libmeos == 'true' && steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        "$REPO_ROOT/tools/provision-meos.sh" \
          --mdb-src "$GITHUB_WORKSPACE/_mobilitydb_src" \
          --build-libmeos \
          --families "${{ inputs.families }}" \
          --parse-prefix "$RUNNER_TEMP/meos-headers" \
          --runtime-prefix /usr/local
        mkdir -p "$RUNNER_TEMP/meos-catalog"
        cp "$REPO_ROOT/output/meos-idl.json" "$RUNNER_TEMP/meos-catalog/meos-idl.json"

    # A cache hit holds what the build step leaves: the parse prefix, which `cmake --install`
    # filled with the same files it installs under /usr/local, and the catalog. Installing the
    # prefix and placing the catalog where run.py writes it gives the consumer the same files
    # and the same outputs as a build.
    - name: Install the cached libmeos prefix and catalog
      id: restore
      if: inputs.build-libmeos == 'true' && steps.build-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        sudo cp -a "$RUNNER_TEMP/meos-headers/." /usr/local/
        sudo ldconfig
        mkdir -p "$REPO_ROOT/output"
        cp "$RUNNER_TEMP/meos-catalog/meos-idl.json" "$REPO_ROOT/output/meos-idl.json"
        {
          echo "catalog-path=$REPO_ROOT/output/meos-idl.json"
          echo "libmeos-prefix=/usr/local"
        } >> "$GITHUB_OUTPUT"
        echo "Restored libmeos and the catalog ($(wc -c < "$REPO_ROOT/output/meos-idl.json") bytes)" >&2
